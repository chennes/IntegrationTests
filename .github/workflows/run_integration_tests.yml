# This is a build and test workflow for the integration test suite of FreeCAD

name: Integration Test Suite

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Run every day at 1am
    - cron: "0 1 * * *"

permissions:
  issues: write

jobs:
  check_licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
      with:
        egress-policy: audit

    - name: Checkout Integration Tests
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install dependencies
      run: pip install defusedxml

    - name: Check licenses
      run: python3 Scripts/CheckLicenses.py

  run_integration_tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 5
      CCACHE_CONFIGPATH: ${{ github.workspace }}/ccache/config
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_NODIRECT: true
      CCACHE_NOHASHDIR: true
      CCACHE_NOINODECACHE: true
      CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,pch_defines,time_macros"
      builddir: ${{ github.workspace }}/build/release/
      cacheKey: pixi-ubuntu-latest
      config: release
      logdir: ${{ github.workspace }}/logs/

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
      with:
        egress-policy: audit

    - name: Set Platform Environment Variables
      shell: bash -l {0}
      env:
        OPERATING_SYSTEM: ${{ runner.os }}
      run: |
        if [[ $OPERATING_SYSTEM == 'Windows' ]]; then
          echo 'CCACHE_COMPILERCHECK=%compiler%' >> "$GITHUB_ENV"
        else
          echo 'CCACHE_COMPILERCHECK=%compiler% -dumpfullversion -dumpversion' >> "$GITHUB_ENV"
        fi

    - name: Checkout FreeCAD
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2
        submodules: recursive
        path: FreeCAD
        ref: main
        repository: FreeCAD/FreeCAD

    - name: Checkout Integration Tests
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: IntegrationTests

    - name: Make needed directories, files and initializations
      id: Init
      run: |
        mkdir -p ${{ env.builddir }}
        mkdir -p ${{ env.logdir }}

    - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
      with:
        pixi-version: v0.59.0
        cache: false
        manifest-path: ${{ github.workspace }}/FreeCAD/pixi.toml

    - name: Restore Compiler Cache
      id: cache-restore
      if: always()
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
        restore-keys: |
          FC-${{ env.cacheKey }}-${{ github.ref }}-
          FC-${{ env.cacheKey }}-

    - name: CMake Configure
      run: |
        cd ${{ github.workspace }}/FreeCAD
        pixi run configure-${{ env.config }}

    - name: CMake Build
      run: |
        cd ${{ github.workspace }}/FreeCAD
        pixi run build-${{ env.config }}

    - name: FreeCAD Integration Tests
      id: integration_tests
      if: always()
      run: |
        set +e
        cd ${{ github.workspace }}
        output=$(python3 IntegrationTests/Scripts/RunIntegrationTests.py --freecad FreeCAD/build/${{ env.config }}/bin/FreeCADCmd --script IntegrationTests/Scripts/EvaluateFile.FCMacro --fcstd-dir IntegrationTests/Data/CADFiles/ --baseline-dir IntegrationTests/Data/BaselineResults/ --exceptions-dir IntegrationTests/Data/Exceptions/ --known-failures-dir IntegrationTests/Data/KnownFailures/ --verbose 2>&1)
        rc=$?
        echo "$output"
        echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
        echo "Integration test exit code: $rc"
        # Parse the machine-readable badge stats
        badge_json=$(echo "$output" | grep '^BADGE_JSON:' | sed 's/^BADGE_JSON://')
        if [ -n "$badge_json" ]; then
          ok=$(echo "$badge_json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['ok'])")
          xfail=$(echo "$badge_json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['xfail'])")
          fail=$(echo "$badge_json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['fail'])")
          error=$(echo "$badge_json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['error'])")
          echo "badge_ok=$ok" >> "$GITHUB_OUTPUT"
          echo "badge_xfail=$xfail" >> "$GITHUB_OUTPUT"
          echo "badge_fail=$fail" >> "$GITHUB_OUTPUT"
          echo "badge_error=$error" >> "$GITHUB_OUTPUT"
        fi

    - name: Update status badge
      if: always() && github.ref == 'refs/heads/main' && steps.integration_tests.outputs.badge_ok != ''
      uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
      with:
        auth: ${{ secrets.GIST_TOKEN }}
        gistID: ${{ vars.BADGE_GIST_ID }}
        filename: integration_tests_badge.json
        label: integration tests
        message: "${{ steps.integration_tests.outputs.badge_ok }} pass \u00b7 ${{ steps.integration_tests.outputs.badge_xfail }} xfail \u00b7 ${{ steps.integration_tests.outputs.badge_fail }} fail \u00b7 ${{ steps.integration_tests.outputs.badge_error }} error"
        color: >-
          ${{
            steps.integration_tests.outputs.badge_fail != '0' && 'red' ||
            steps.integration_tests.outputs.badge_error != '0' && 'orange' ||
            'brightgreen'
          }}

    - name: Open issue on failure
      if: always() && steps.integration_tests.outputs.exit_code != '0'
      uses: actions/github-script@v9
      with:
        script: |
          const title = `FreeCAD integration tests failed (${process.env.GITHUB_REF_NAME})`;
          const body = [
            `Run: https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            `Exit code: ${{ steps.integration_tests.outputs.exit_code }}`,
          ].join('\n');
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title,
            body
          });

    - name: Save Compiler Cache
      id: cache-save
      if: always()
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
