# SPDX-License-Identifier: LGPL-2.1-or-later

# This is a build and test workflow for the integration test suite of FreeCAD

name: Integration Test Suite

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Run every day at 1am
    - cron: "0 1 * * *"

permissions:
  issues: write

jobs:
  check_licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout Integration Tests
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: pip install defusedxml

    - name: Check licenses
      run: python3 Scripts/CheckLicenses.py

  run_integration_tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 5
      CCACHE_CONFIGPATH: ${{ github.workspace }}/ccache/config
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_NODIRECT: true
      CCACHE_NOHASHDIR: true
      CCACHE_NOINODECACHE: true
      CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,pch_defines,time_macros"
      builddir: ${{ github.workspace }}/build/release/
      cacheKey: pixi-ubuntu-latest
      config: release
      logdir: ${{ github.workspace }}/logs/

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Set Platform Environment Variables
      shell: bash -l {0}
      env:
        OPERATING_SYSTEM: ${{ runner.os }}
      run: |
        if [[ $OPERATING_SYSTEM == 'Windows' ]]; then
          echo 'CCACHE_COMPILERCHECK=%compiler%' >> "$GITHUB_ENV"
        else
          echo 'CCACHE_COMPILERCHECK=%compiler% -dumpfullversion -dumpversion' >> "$GITHUB_ENV"
        fi

    - name: Checkout FreeCAD
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        submodules: recursive
        path: FreeCAD
        ref: main
        repository: FreeCAD/FreeCAD

    - name: Checkout Integration Tests
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: IntegrationTests

    - name: Make needed directories, files and initializations
      id: Init
      run: |
        mkdir -p ${{ env.builddir }}
        mkdir -p ${{ env.logdir }}

    - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: latest
        cache: false
        manifest-path: ${{ github.workspace }}/FreeCAD/pixi.toml

    - name: Restore Compiler Cache
      id: cache-restore
      if: always()
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
        restore-keys: |
          FC-${{ env.cacheKey }}-${{ github.ref }}-
          FC-${{ env.cacheKey }}-

    - name: CMake Configure
      run: |
        cd ${{ github.workspace }}/FreeCAD
        pixi run configure-${{ env.config }}

    - name: CMake Build
      run: |
        cd ${{ github.workspace }}/FreeCAD
        pixi run build-${{ env.config }}

    - name: FreeCAD Integration Tests
      id: integration_tests
      if: always()
      run: |
        set +e
        cd ${{ github.workspace }}
        output=$(python3 IntegrationTests/Scripts/RunIntegrationTests.py --freecad FreeCAD/build/${{ env.config }}/bin/FreeCADCmd --script IntegrationTests/Scripts/EvaluateFile.FCMacro --fcstd-dir IntegrationTests/Data/CADFiles/ --baseline-dir IntegrationTests/Data/BaselineResults/ --exceptions-dir IntegrationTests/Data/Exceptions/ --known-failures-dir IntegrationTests/Data/KnownFailures/ --verbose 2>&1)
        rc=$?
        echo "$output"
        echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
        echo "Integration test exit code: $rc"
        # Parse the machine-readable badge stats
        badge_json=$(echo "$output" | grep '^BADGE_JSON:' | sed 's/^BADGE_JSON://')
        if [ -n "$badge_json" ]; then
          ok=$(echo "$badge_json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['ok'])")
          xfail=$(echo "$badge_json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['xfail'])")
          fail=$(echo "$badge_json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['fail'])")
          error=$(echo "$badge_json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['error'])")
          echo "badge_ok=$ok" >> "$GITHUB_OUTPUT"
          echo "badge_xfail=$xfail" >> "$GITHUB_OUTPUT"
          echo "badge_fail=$fail" >> "$GITHUB_OUTPUT"
          echo "badge_error=$error" >> "$GITHUB_OUTPUT"
        fi
        # Persist the per-file failure records for the issue-creation step.
        failures_json=$(echo "$output" | grep '^FAILURES_JSON:' | sed 's/^FAILURES_JSON://')
        printf '%s' "$failures_json" > "${{ github.workspace }}/failures.json"

    - name: Update status badge
      if: always() && github.ref == 'refs/heads/main' && steps.integration_tests.outputs.badge_ok != ''
      uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
      with:
        auth: ${{ secrets.GIST_TOKEN }}
        gistID: ${{ vars.BADGE_GIST_ID }}
        filename: integration_tests_badge.json
        label: integration tests
        message: "${{ steps.integration_tests.outputs.badge_ok }} pass \u00b7 ${{ steps.integration_tests.outputs.badge_xfail }} xfail \u00b7 ${{ steps.integration_tests.outputs.badge_fail }} fail \u00b7 ${{ steps.integration_tests.outputs.badge_error }} error"
        color: >-
          ${{
            steps.integration_tests.outputs.badge_fail != '0' && 'red' ||
            steps.integration_tests.outputs.badge_error != '0' && 'orange' ||
            'brightgreen'
          }}

    - name: Reconcile failure issues
      if: always() && steps.integration_tests.outputs.exit_code != ''
      uses: actions/github-script@v9
      env:
        EXIT_CODE: ${{ steps.integration_tests.outputs.exit_code }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const label = 'integration-test-failure';
          const titlePrefix = 'Integration test failure: ';
          const genericTitle = 'FreeCAD integration tests failed';
          const exitCode = process.env.EXIT_CODE;
          const runUrl =
            `https://github.com/${process.env.GITHUB_REPOSITORY}` +
            `/actions/runs/${process.env.GITHUB_RUN_ID}`;

          // Ensure the shared label exists before we attach it to any issue.
          try {
            await github.rest.issues.getLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label,
            });
          } catch (e) {
            await github.rest.issues.createLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label,
              color: 'd73a4a',
              description: 'A FreeCAD integration test is failing for this file',
            });
          }

          // Load the per-file failure records produced by the test runner. An
          // empty array means the suite ran and nothing failed. A failure to
          // read/parse means the runner never emitted records (e.g. it crashed
          // before reporting), in which case we must NOT close anything because
          // we have no trustworthy view of what passed.
          let records = [];
          let reconcile = false;
          const failuresPath = path.join(process.env.GITHUB_WORKSPACE, 'failures.json');
          try {
            const raw = fs.readFileSync(failuresPath, 'utf8').trim();
            if (raw) {
              records = JSON.parse(raw);
              reconcile = true;
            }
          } catch (e) {
            core.warning(`Could not read failures.json: ${e}`);
          }

          // All currently-open failure issues. We keep at most one open issue
          // per file, so we look these up once and reconcile against them.
          const openIssues = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
            per_page: 100,
          });
          const openByTitle = new Map(openIssues.map((i) => [i.title, i]));

          // Set of files that are failing right now (only meaningful when we
          // have a trustworthy set of records).
          const failingFiles = new Set(records.map((r) => r.file));

          // Open an issue for each failing file that does not already have one.
          for (const rec of records) {
            const title = `${titlePrefix}${rec.file}`;
            if (openByTitle.has(title)) {
              core.info(`Issue already open for ${rec.file}; skipping.`);
              continue;
            }
            const kind = rec.kind === 'error' ? 'error' : 'failure';
            const bodyLines = [
              `The integration test for \`${rec.file}\` reported a ${kind}.`,
              '',
              `**Summary:** ${rec.summary}`,
            ];
            if (rec.details && rec.details.length) {
              bodyLines.push('', '```', ...rec.details, '```');
            }
            bodyLines.push('', `Run: ${runUrl}`);
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: [label],
              body: bodyLines.join('\n'),
            });
            openByTitle.set(title, created.data);
            core.info(`Opened issue for ${rec.file}.`);
          }

          // Fallback: the runner exited non-zero but produced no per-file
          // records (e.g. it crashed before reporting). Open a single generic
          // issue, de-duplicated against any existing open one. We cannot
          // reconcile per-file issues in this case, so leave them untouched.
          if (!reconcile) {
            if (exitCode !== '0' && !openByTitle.has(genericTitle)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: genericTitle,
                labels: [label],
                body: [
                  'The integration test suite exited non-zero but produced no ' +
                    'per-file failure records.',
                  '',
                  `Run: ${runUrl}`,
                ].join('\n'),
              });
            }
            return;
          }

          // Auto-close any open issue whose failure is now resolved: per-file
          // issues whose file is no longer failing, plus the generic fallback
          // issue once the suite produces a clean run again.
          for (const [title, issue] of openByTitle) {
            let resolved = false;
            if (title.startsWith(titlePrefix)) {
              const file = title.slice(titlePrefix.length);
              resolved = !failingFiles.has(file);
            } else if (title === genericTitle) {
              resolved = exitCode === '0';
            }
            if (!resolved) {
              continue;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Resolved: this test passed in a later run.\n\nRun: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed resolved issue #${issue.number} (${title}).`);
          }

    - name: Save Compiler Cache
      id: cache-save
      if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
